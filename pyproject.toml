[project]
name = "privacygate"
version = "0.1.0"
description = "A pre-LLM privacy firewall for business documents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "spacy>=3.8.16",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build==0.11.19"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
