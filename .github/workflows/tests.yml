name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"
          python-version: "3.11"
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest
